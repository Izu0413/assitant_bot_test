name: WakePuri
options:
  bundleIdPrefix: com.izu0413
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  WakePuri:
    type: application
    platform: iOS
    sources:
      - WakePuri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izu0413.wakepuri
        # タスク3で自分の Team ID(10桁の英数字)を入れる。空のままだと実機に入れられない
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: WakePuri/Info.plist
      properties:
        CFBundleDisplayName: わけプリ
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: みんなでプリを撮るためにカメラを使います。
        NSPhotoLibraryAddUsageDescription: もらったプリを写真フォルダに保存します。
        NSLocalNetworkUsageDescription: 近くにいる友達とプリを受け渡しするために使います。
        # MultipeerConnectivity のサービス名(PeerService と一致させる)
        NSBonjourServices:
          - _wakepuri._tcp
          - _wakepuri._udp
